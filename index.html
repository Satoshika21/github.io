<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nodo 21 - Hub de Soberanía Financiera</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #2d3740;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 40px 20px;
            text-align: center;
            box-sizing: border-box;
        }

        .logo-text {
            font-size: 110px;
            font-weight: 900;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            line-height: 0.8;
            margin-bottom: 20px;
            letter-spacing: -3px;
        }
        .logo-n {
            color: #f37021;
        }
        .logo-21 {
            color: #2d3740;
            font-size: 45px;
            margin-top: 6px;
            margin-left: 4px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 8px 0;
        }

        p.description {
            font-size: 16px;
            color: #666666;
            margin: 0 0 40px 0;
            line-height: 1.5;
        }

        .links-space {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            display: block;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            padding: 18px 20px;
            border-radius: 12px;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .btn-dark {
            background-color: #2d3740;
            color: #ffffff;
        }
        .btn-dark:hover {
            background-color: #1a1a1a;
        }

        .btn-orange {
            background-color: #f37021;
            color: #ffffff;
        }
        .btn-orange:hover {
            background-color: #e05e13;
        }

        .btn-disabled {
            background-color: #f5f5f5;
            color: #aaaaaa;
            border: 2px dashed #dddddd;
            cursor: not-allowed;
        }

        .footer {
            margin-top: 50px;
            font-size: 13px;
            color: #999999;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="logo-text">
            <span class="logo-n">N</span><span class="logo-21">21</span>
        </div>

        <h1>Nodo 21</h1>
        
        <p class="description">Hub de soberanía financiera y adopción de Bitcoin en España.</p>

        <div class="links-space">
            
            <a href="https://x.com/Nodo21Hub" class="btn btn-dark" target="_blank" rel="noopener noreferrer">
                X / Twitter
            </a>

            <a href="mailto:contacto@nodo21hub.com" class="btn btn-dark">
                Correo Electrónico
            </a>

            <a href="#" class="btn btn-orange">
                ⚡️ Red Lightning (Aportaciones)
            </a>

            <a href="#" class="btn btn-disabled" onclick="return false;">
                Nostr (Próximamente)
            </a>

        </div>

        <div class="footer">
            <p>Nodo 21 • Código Abierto & Sin Rastreadores</p>
        </div>

    </div>

</body>
</html>
